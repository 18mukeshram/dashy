  customCss: "@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');\n\
    \n:root {\n  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif\
    \ !important;\n  --font-headings: 'Plus Jakarta Sans', system-ui, -apple-system,\
    \ sans-serif !important;\n  --font-monospace: 'JetBrains Mono', monospace !important;\n\
    }\nbody, html {\n  font-family: 'Plus Jakarta Sans', system-ui, -apple-system,\
    \ sans-serif !important;\n}\n"
  defaultOpeningMethod: newtab
  allowConfigEdit: true
  statusCheckInterval: 0
  colCount: 4
  itemSize: small
