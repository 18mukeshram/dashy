  customCss: "/* Futuristic Glassmorphism & Cyber-Tech Styling */\n@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\
    \n:root {\n  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif !important;\n\
    \  --font-headings: 'Plus Jakarta Sans', system-ui, sans-serif !important;\n}\n\
    \nbody {\n  font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;\n\
    \  background-attachment: fixed !important;\n  background-size: cover !important;\n\
    \  background-position: center !important;\n}\n\n/* Background dark vignette overlay\
    \ */\nbody::before {\n  content: '';\n  position: fixed;\n  top: 0; left: 0; right:\
    \ 0; bottom: 0;\n  background: radial-gradient(circle at 50% 20%, rgba(10, 14,\
    \ 26, 0.45), rgba(5, 8, 16, 0.88));\n  pointer-events: none;\n  z-index: 0;\n\
    }\n\n#app, #main-page {\n  position: relative;\n  z-index: 1;\n}\n\n/* Glass Header\
    \ / Nav Bar */\nheader, #nav {\n  background: rgba(13, 17, 30, 0.65) !important;\n\
    \  backdrop-filter: blur(20px) saturate(180%) !important;\n  -webkit-backdrop-filter:\
    \ blur(20px) saturate(180%) !important;\n  border-bottom: 1px solid rgba(255,\
    \ 255, 255, 0.08) !important;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;\n\
    }\n\n/* Floating Futuristic Search Bar */\n.search-container {\n  background:\
    \ rgba(18, 24, 42, 0.75) !important;\n  backdrop-filter: blur(24px) saturate(200%)\
    \ !important;\n  -webkit-backdrop-filter: blur(24px) saturate(200%) !important;\n\
    \  border: 1px solid rgba(99, 102, 241, 0.35) !important;\n  border-radius: 16px\
    \ !important;\n  box-shadow: 0 0 25px rgba(99, 102, 241, 0.2), inset 0 1px 1px\
    \ rgba(255, 255, 255, 0.1) !important;\n  transition: all 0.3s cubic-bezier(0.4,\
    \ 0, 0.2, 1) !important;\n}\n.search-container:focus-within {\n  border-color:\
    \ rgba(56, 189, 248, 0.8) !important;\n  box-shadow: 0 0 35px rgba(56, 189, 248,\
    \ 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.2) !important;\n  transform: translateY(-1px)\
    \ scale(1.005) !important;\n}\n.search-container input {\n  color: #f1f5f9 !important;\n\
    \  font-weight: 500 !important;\n}\n\n/* Frosted Glass Section Cards */\n.collapsable\
    \ {\n  background: rgba(15, 21, 37, 0.68) !important;\n  backdrop-filter: blur(20px)\
    \ saturate(190%) !important;\n  -webkit-backdrop-filter: blur(20px) saturate(190%)\
    \ !important;\n  border: 1px solid rgba(255, 255, 255, 0.08) !important;\n  border-radius:\
    \ 18px !important;\n  box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45) !important;\n\
    \  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;\n}\n.collapsable:hover\
    \ {\n  border-color: rgba(99, 102, 241, 0.4) !important;\n  box-shadow: 0 16px\
    \ 40px 0 rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.15) !important;\n}\n\
    \n/* Glowing Category Header */\n.section-header {\n  padding: 12px 18px !important;\n\
    \  border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;\n}\n.section-header\
    \ h3 {\n  font-weight: 700 !important;\n  letter-spacing: 0.4px !important;\n\
    \  color: #f8fafc !important;\n}\n.section-icon {\n  filter: drop-shadow(0 0 8px\
    \ rgba(56, 189, 248, 0.6)) !important;\n  color: #38bdf8 !important;\n}\n\n/*\
    \ Tech Item Tiles */\n.item-wrapper {\n  margin: 4px !important;\n}\n.tile-title\
    \ {\n  background: rgba(255, 255, 255, 0.035) !important;\n  border: 1px solid\
    \ rgba(255, 255, 255, 0.06) !important;\n  border-radius: 12px !important;\n \
    \ padding: 8px 12px !important;\n  transition: all 0.22s cubic-bezier(0.4, 0,\
    \ 0.2, 1) !important;\n}\n.item-wrapper a:hover .tile-title {\n  background: rgba(99,\
    \ 102, 241, 0.18) !important;\n  border-color: rgba(56, 189, 248, 0.6) !important;\n\
    \  box-shadow: 0 8px 24px -4px rgba(56, 189, 248, 0.3), 0 0 12px rgba(99, 102,\
    \ 241, 0.25) !important;\n  transform: translateY(-2px) !important;\n}\n\n/* Crisp\
    \ App-Badge Favicons */\n.tile-icon, .item-icon img, .tile-icon img {\n  border-radius:\
    \ 8px !important;\n  padding: 2px !important;\n  background: rgba(255, 255, 255,\
    \ 0.08) !important;\n  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)) !important;\n\
    \  width: 28px !important;\n  height: 28px !important;\n  object-fit: contain\
    \ !important;\n}\n\n/* Text Polish */\n.tile-title .title {\n  font-weight: 600\
    \ !important;\n  color: #f1f5f9 !important;\n}\n.tile-title .description {\n \
    \ color: #94a3b8 !important;\n  font-size: 0.82rem !important;\n}"
  defaultOpeningMethod: newtab
  allowConfigEdit: true
